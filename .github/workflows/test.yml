name: Test

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: '30 06 * * *'

jobs:
  test:
    name: Run tests and linters
    runs-on: ubuntu-latest
    env:
      LANG: en_US.utf8
      DEBIAN_FRONTEND: noninteractive
      PG_MAJOR: 18
    container:
      image: ubuntu:resolute
    steps:
      - uses: actions/checkout@v6
      - name: Set locale to utf-8
        run: |
          apt-get update
          apt-get install -y ca-certificates locales
          locale-gen en_US.UTF-8
      - name: Set postgresql uid/gid
        run: |
          groupadd -r postgres --gid=999
          useradd -r -d /var/lib/postgresql -g postgres --uid=999 postgres
      - name: Install postgresql-common, wget and jq
        run: |
          apt-get install -y postgresql-common wget jq
      - name: Check for spelling typos
        uses: crate-ci/typos@master
      - name: Install PostgreSQL ${PG_MAJOR} and Python
        run: |
          YES=yes /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          apt-get update
          apt-get -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" install -y postgresql-common sudo libpq-dev python3-dev python3-venv build-essential postgresql-$PG_MAJOR postgresql-contrib-$PG_MAJOR
          python3 -m venv /venv
          /venv/bin/pip install tox
          ln -s /venv/bin/tox /usr/local/bin/tox
      - name: Start PostgreSQL
        run: |
          chown -R postgres:postgres .
          mkdir -p /var/log/postgresql
          chown postgres:postgres /var/log/postgresql
          sudo -u postgres /usr/lib/postgresql/${PG_MAJOR}/bin/pg_ctl -D /etc/postgresql/${PG_MAJOR}/main -l /var/log/postgresql/postgresql-${PG_MAJOR}-main.log start
      - name: Run tox
        run: sudo -u postgres /usr/local/bin/tox
