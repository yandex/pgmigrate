# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py314, ruff, pylint, yapf

[testenv:py314]
allowlist_externals = rm
commands = rm -rf htmlcov
           coverage erase
           coverage run -p --include=pgmigrate.py {envbindir}/behave -q
           coverage combine
           coverage html pgmigrate.py
           coverage report --fail-under=100 pgmigrate.py
deps = behave
       coverage
       func_timeout

[testenv:{ruff,pylint,yapf}]
envdir = {toxworkdir}/.lint_env
commands =
    flake8: ruff check pgmigrate.py setup.py
    pylint: pylint pgmigrate.py
    yapf: yapf -pd pgmigrate.py
deps = ruff
       pylint
       yapf==0.43.0

[flake8]
copyright-check = True
select = E,F,W,C
copyright-regexp = Copyright\s+(\(C\)\s+)?(\d{4}-)?2016-2026\s+%(author)s
copyright-author = Yandex LLC
